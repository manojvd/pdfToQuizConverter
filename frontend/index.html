<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Quiz</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .quiz-container {
      background-color: #1e1e1e;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      padding: 30px;
      max-width: 600px;
      width: 100%;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .question {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

.submit-button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
}
.submit-button:hover {
    background-color: #0056b3;
}

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      background-color: #2e2e2e;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
    }

    .option:hover {
      background-color: #3a3a3a;
    }

    .option.selected {
      background-color: #3949ab;
      border-color: #5c6bc0;
    }

    .option.correct {
      background-color: #2e7d32;
      border-color: #66bb6a;
    }

    .option.incorrect {
      background-color: #c62828;
      border-color: #ef5350;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }

    .timer {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .progress {
      height: 10px;
      margin-bottom: 20px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #6200ea;
      transition: width 0.3s ease;
    }

    .results {
      text-align: center;
    }

    .result-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .score {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #6200ea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #3700b3;
    }
  </style>
</head>
<body>
<div class="quiz-container" id="quiz">
  <div class="quiz-header">
    <h2>Interactive Quiz</h2>
    <div class="progress">
      <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0"
           aria-valuemax="100"></div>
    </div>
  </div>
  <div id="question-container">
    <p class="question" id="question"></p>
    <div class="options" id="options"></div>
  </div>
  <div class="quiz-footer">
    <div class="timer" id="timer">Time: 30s</div>
    <button class="btn" id="next-btn">Next</button>
  </div>
</div>

<script>


const quizData = [
    {
        "question": "Pharmacodynamics studies",
        "options": [
            "suction",
            "localization and mechanisms of action",
            "biotransformation",
            "distribution in the body",
            "excretion from the body"
        ],
        "correct": 1
    },
    {
        "question": "Pharmacokinetics studies",
        "options": [
            "localization of the action",
            "mechanism of action",
            "Targets for drug action",
            "pharmacological effects",
            "excretion from the body"
        ],
        "correct": 4
    }];
let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 30;

const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const nextBtn = document.getElementById('next-btn');
const submitAnswer = document.getElementById('submit-button');
const timerEl = document.getElementById('timer');
const progressBar = document.querySelector('.progress-bar');
const quizContainer = document.getElementById('quiz');

function loadQuestion() {
    const question = quizData[currentQuestion];
    questionEl.textContent = question.question;
    optionsEl.innerHTML = '';
    question.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.textContent = option;
        button.classList.add('option');
        button.addEventListener('click', () => selectOption(button, index));
        optionsEl.appendChild(button);
    });
    nextBtn.style.display = 'none';
    timeLeft = 30;
    if (timer) clearInterval(timer);
    startTimer();
    updateProgress();
}

function selectOption(selectedButton, optionIndex) {
    const buttons = optionsEl.getElementsByClassName('option');
    Array.from(buttons).forEach(button => button.classList.remove('selected'));
    selectedButton.classList.add('selected');
    nextBtn.style.display = 'block';
}

function startTimer() {
    timerEl.textContent = `Time: ${timeLeft}s`;
    timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `Time: ${timeLeft}s`;
        if (timeLeft === 0) {
            clearInterval(timer);
            checkAnswer();
        }
    }, 1000);
}

function checkAnswer() {
    const selectedOption = document.querySelector('.option.selected');
    if (!selectedOption) return;

    const selectedAnswer = Array.from(optionsEl.children).indexOf(selectedOption);
    const question = quizData[currentQuestion];

    if (selectedAnswer === question.correct) {
        score++;
        selectedOption.classList.add('correct');
    } else {
        selectedOption.classList.add('incorrect');
        optionsEl.children[question.correct].classList.add('correct');
    }

    Array.from(optionsEl.children).forEach(button => button.disabled = true);
    clearInterval(timer);
}

function updateProgress() {
    const progress = ((currentQuestion + 1) / quizData.length) * 100;
    progressBar.style.width = `${progress}%`;
    progressBar.setAttribute('aria-valuenow', progress);
}

function showResults() {
    quizContainer.innerHTML = `
        <div class="results">
            <div class="result-icon">
                <i class="fas ${score > quizData.length / 2 ? 'fa-trophy' : 'fa-times-circle'}"></i>
            </div>
            <div class="score">Your score: ${score}/${quizData.length}</div>
            <p>${score > quizData.length / 2 ? 'Great job !!!' : 'Better luck next time!'}</p>
            <button class="btn" onclick="location.reload()">Restart Quiz</button>
        </div>
    `;
}

//     const selectedOption = document.querySelector('.option.selected');
//     if (!selectedOption) return;

//     const selectedAnswer = Array.from(optionsEl.children).indexOf(selectedOption);
//     const question = quizData[currentQuestion];

//     if (selectedAnswer === question.correct) {
//         score++;
//         selectedOption.classList.add('correct');
//     } else {
//         selectedOption.classList.add('incorrect');
//         optionsEl.children[question.correct].classList.add('correct');
//     }

//     Array.from(optionsEl.children).forEach(button => button.disabled = true);
// }

function reviewAnswers() {
    const reviewContainer = document.createElement('div');
    reviewContainer.classList.add('review-container');
    quizContainer.innerHTML = '';
    quizContainer.appendChild(reviewContainer);

    quizData.forEach((question, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.classList.add('review-question');
        questionDiv.innerHTML = `
            <p>${index + 1}. ${question.question}</p>
            <p>Your answer: ${question.options[question.correct]}</p>
        `;
        reviewContainer.appendChild(questionDiv);
    });

    const restartButton = document.createElement('button');
    restartButton.classList.add('btn');
    restartButton.textContent = 'Restart Quiz';
    restartButton.onclick = () => location.reload();
    reviewContainer.appendChild(restartButton);
}

nextBtn.addEventListener('click', () => {
    checkAnswer();
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
        // submitAnswer();
    } else {
        showResults();
        reviewAnswers();
    }
});

loadQuestion();
</script>
</body>
</html>
